name = "nodecrypt"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 配置静态资源
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# 自定义域：把 chat.cxywh.cn 绑到这个 Worker
#
# 用 Workers 的 Custom Domain 机制（custom_domain = true），
# 而不是去 DNS 页面手写记录：
#   · 它会自动创建正确的 DNS 记录（Cloudflare 代理）
#   · 并自动签发/续期边缘证书
#   · 手写记录容易把 SSL/TLS 模式搞成「灵活」，导致 http->https 重定向死循环
[[routes]]
pattern = "chat.cxywh.cn"
custom_domain = true
