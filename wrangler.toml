name = "nodecrypt"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 配置静态资源
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# 文件密文存储
#
# R2 里只放**密文**：客户端本地分块 AES-GCM 加密后上传，密钥从不经过服务端。
# 对象名只含随机 blobId + 块号，不含文件名、不含任何用户信息 —— 服务端无法把
# 对象关联到人，也解不开。
#
# ⚠️ 当前**故意注释掉**。
#
# 原因：R2 必须先在 Cloudflare 控制台绑定支付方式才能启用（免费额度也要绑卡）。
# 桶不存在时部署会直接失败： code 10085 "R2 bucket not found"。
#
# 代码侧已经能自动适应这种情况 —— client/js/util.blob.js 的 isR2Available() 会在
# 启动时 HEAD 一次 /blob/<合法blobId>/0：
#     · 503  = 绑定缺失   -> 阈值当作无穷大，大文件全部退回 WebSocket 中继
#     · 404  = R2 在但对象不存在 -> 阈值 1 MiB，大文件走 R2
# 所以注释掉这一段不影响功能，只是大文件更耗流量。
#
# 拿到可用的卡之后，三步切回 R2（无需改任何代码）：
#   1. 控制台 -> 存储和数据库 -> R2 -> 概览 -> 完成结账流程（会有一笔 $5 预授权
#      冻结，不是扣费，银行会自动释放）
#   2. npx wrangler r2 bucket create nodecrypt-files
#   3. 取消下面两行的注释，再 npx wrangler deploy
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "nodecrypt-files"

# 自定义域：把 chat.cxywh.cn 绑到这个 Worker
#
# 用 Workers 的 Custom Domain 机制（custom_domain = true），
# 而不是去 DNS 页面手写记录：
#   · 它会自动创建正确的 DNS 记录（Cloudflare 代理）
#   · 并自动签发/续期边缘证书
#   · 手写记录容易把 SSL/TLS 模式搞成「灵活」，导致 http->https 重定向死循环
[[routes]]
pattern = "chat.cxywh.cn"
custom_domain = true
